<!DOCTYPE html>
<html xmlns="fn">
    <head>
        <meta charset="utf-8">
        <meta name="viewport" content="width=device-width, initial-scale=1">
        <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
        <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/4.7.0/css/font-awesome.min.css" rel="stylesheet">
        <link href="style.css" rel="stylesheet">
        <link href='https://fonts.googleapis.com/css?family=Dosis|Oswald' rel='stylesheet'>
        <script>
            function welcome()
            {
                alert("Welcome to Chow's Ordering Store!");
                const date = new Date();
                const name = prompt("What is your name?", "John Deere");
                const item = prompt("What item would you like to buy?", "tractor");
                const amt = prompt("How many of those would you like?", "39");
                var greeting;
                var time = date.getHours() + ":" + date.getMinutes();
                var month = date.getMonth() + 1;
                var day = date.getDate() + 7;
                var year = date.getFullYear();
                
                if (day > 31)
                {
                    if (month == 11)
                    {
                        year++;
                        month = 0;
                    }
                    month++;
                    day -= 31;
                }
                var delivery = month + " / " + day + " / " + year;
                
                if (date.getHours() >= 18 || date.getHours() < 6)
                {
                    greeting = "Good evening";
                } else if (date.getHours() >= 12)
                {
                    greeting = "Good afternoon";
                } else if (date.getHours() >= 6)
                {
                    greeting = "Good morning";
                }
                if (name != null)
                {
                    document.getElementById("getName").innerHTML =
                    greeting + " " + name + ", thank you for your purchase!";
                }

                if (item != null && amt > 0 && amt <= 99)
                {
                    document.getElementById("getItems").innerHTML =
                    "The current time is " + time +
                    "<br>You requested to buy " + item + " ( " + amt + " ) times.<br>Your item will be delivered by " + delivery +
                    "<br><br>We hope to see you again soon!";
                } else if (amt <= 0 || amt > 99)
                {
                    document.getElementById("getItems").innerHTML =
                    "Invalid item amount; " + item + " ( " + amt + " ) is not within the available parameters ( 1-99 )";
                }
            }
        </script>
        <title>Lab 4</title>
    </head>

    <body onload="welcome()">
        <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js" integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI" crossorigin="anonymous"></script>
        <div id="nav-container"></div>
        
        <div class="container-fluid">
            <p id="getName"></p>
            <p id="getItems"></p>
        </div>

        <script src="navbar.js"></script>
    </body>
</html>
