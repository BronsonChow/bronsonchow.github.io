<!DOCTYPE html>
<html xmlns="fn" lang="en" data-bs-theme="voca-light">
    <head>
        <meta charset="utf-8">
        <meta name="viewport" content="width=device-width, initial-scale=1">

        <script src="../../userSettings.js"></script>

        <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
        <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js" integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI" crossorigin="anonymous"></script>

        <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/4.7.0/css/font-awesome.min.css" rel="stylesheet">
        <link rel="preconnect" href="https://fonts.googleapis.com">
        <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
        <link href="https://fonts.googleapis.com/css2?family=Bubblegum+Sans&family=Chewy&display=swap" rel="stylesheet">
        <link href="https://fonts.googleapis.com/css2?family=Noto+Sans:ital,wdth,wght@0,62.5..100,100..900;1,62.5..100,100..900&display=swap" rel="stylesheet">
        
        <link href="vocaStyle.css" rel="stylesheet">
        
        <link rel="icon" href="../../assets/bc_logo.svg">

        <title>BC's Vocaloid Project</title>
    </head>

    <body onload="loadTopRated()">
        <div id="nav"></div><script src="../../navbar.js"></script>

        <div class="hero-background">
            <div class="hero-card">
                <h1 class="hero-head">My Favorite Songs & Producers</h1>
                <div class="btn-group hero-btn">
                    <a href="voca.html" class="btn btn-voca active">My Favorites</a>
                    <a href="vocaTopSongs.html" class="btn btn-voca">Most Rated Songs</a>
                </div>
            </div>
        </div>
        <p class="hero-credit">Image by Rella : Links in Footer</p>

        <div class="container-fluid">
            <div class="row">
                <div class="col-lg-2"></div>
                <div class="col-lg-8">
                    <div class="container-fluid cell">
                            <div class="container-fluid" style="text-align: center;">
                                <h1>Top Songs by Rating Count of All Time</h1>
                                <p>on vocadb.net</p>
                            </div>
                        <div class="container-fluid centered">
                            <div class = "row row-cols-1">
                                <label for="maxSongs" class="form-label">Display Amount: <span id="valueDisplay">13</span></label>
                                <input type="range" class="range-voca" min="1" max="25" id="maxSongs" width="500"
                                    oninput="displayTopSongs(this.value)">
                            </div>
                        </div>
                        &nbsp;
                        <div class="overflow-auto">
                            <p id="topRatedSongIndex"></p>
                        </div>
                    </div>
                    <p id="topRatedSongs"></p>
                </div>
                <div class="col-lg-2"></div>
            </div>
        </div>
        &nbsp;

        <div class="row justify-content-center">
            <a class="btn btn-voca" href="#" role="button" style="max-width: 6.5rem;">
                <i class="fa fa-angle-double-up" style="margin: 0;"></i>
                <p style="margin: 0;">Back to top</p>
            </a>
        </div>

        <hr class="my-4">
        <div class="container text-center">
            <div class="row">
                <div class="col align-self-start">
                    <a target="_blank" href="https://vocadb.net/">Information used from VocaDB</a>
                </div>
            </div>
        </div>
    </body>
    <script src="vocaTopSongsScript.js"></script>
</html>
