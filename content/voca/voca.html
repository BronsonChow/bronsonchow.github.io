<!DOCTYPE html>
<html xmlns="fn" lang="en" data-bs-theme="voca-light">
    <head>
        <meta charset="utf-8">
        <meta name="viewport" content="width=device-width, initial-scale=1">

        <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
        <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js" integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI" crossorigin="anonymous"></script>

        <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/4.7.0/css/font-awesome.min.css" rel="stylesheet">
        <link href='https://fonts.googleapis.com/css?family=Dosis|Oswald' rel='stylesheet'>
        
        <link href="vocaStyle.css" rel="stylesheet">

        <title>BC's Vocaloid Project</title>
    </head>

    <body onload="loadData()">
        <div id="nav"></div><script src="navbarVoca.js"></script>

        <div id="sect1"></div>
        <div class="hero-background" id="hero-bg">
            <div class="hero-card">
                <h1 class="hero-head">My Favorite Songs & Producers</h1>
                <div class="btn-group hero-btn">
                    <a href="voca.html" class="btn btn-voca active">My Favorites</a>
                    <a href="vocaTopSongs.html" class="btn btn-voca">Top Songs by Rating Count</a>
                </div>
            </div>
        </div>
        &nbsp;


        <hr class="my-4">
        &nbsp;

        <div class="container-fluid">
            <div class="row">
                <div class="col-lg-2"></div>
                <div class="col-lg-4">
                    <div class="container-fluid cell">
                        <h1 class="centered">Songs</h1>
                        &nbsp;
                        <div class="container-fluid centered">
                            <div class="btn-group" style="max-width: 15rem;">
                                <input type="radio" class="btn-check" name="btnradio" id="btnradio1" autocomplete="off" checked/>
                                <label class="btn btn-voca" for="btnradio1" onclick="sortDataAlphabetically()">Alphabetical</label>

                                <input type="radio" class="btn-check" name="btnradio" id="btnradio2" autocomplete="off"/>
                                <label class="btn btn-voca" for="btnradio2" onclick="sortDataId()">Publish Date</label>
                            </div>
                        </div>
                        &nbsp;
                        <p id="favSongIndex"></p>
                    </div>
                    <p id="favSongCells"></p>
                </div>
                <div class="col-lg-4">
                    <div class="container-fluid cell">
                        <h1 class="centered">Producers</h1> <br>
                        <p id="favProducerIndex"></p>
                    </div>
                    <p id="favProducerCells"></p>
                </div>
                <div class="col-lg-2"></div>
            </div>
        </div>

        <div class="row justify-content-center">
            <a class="btn btn-voca" href="#" role="button" style="max-width: 6.5rem;">
                <i class="fa fa-angle-double-up" style="margin: 0;"></i>
                <p style="margin: 0;">Back to top</p>
            </a>
        </div>

        <hr class="my-4">
        <div class="container text-center">
            <div class="row">
                <div class="col align-self-start">
                    <a target="_blank" href="https://vocadb.net/">Information used from VocaDB.net</a>
                </div>
            </div>
        </div>
        &nbsp;
    </body>
    <script src="vocaScript.js"></script>
</html>
