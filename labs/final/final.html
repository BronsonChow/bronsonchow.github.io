    <body onload="loadData()">
        <div id="nav"></div><script src="navbarFinal.js"></script>

        <div id="sect1"></div>

                <div class="row">
                    <div class="col-md-1"></div>
                    <div class="col-md-11">

                        <p class="lead">
                            <div class="btn-group">

                            </div>
                        </p>
                    </div>
                </div>

                                <input type="radio" class="btn-check" name="btnradio" id="btnradio2" autocomplete="off"/>
