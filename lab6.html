<!DOCTYPE html>
<html xmlns="fn">
    <head>
        <meta charset="utf-8">
        <meta name="viewport" content="width=device-width, initial-scale=1">
        <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
        <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/4.7.0/css/font-awesome.min.css" rel="stylesheet">
        <link href="style.css" rel="stylesheet">
        <link href='https://fonts.googleapis.com/css?family=Dosis|Oswald' rel='stylesheet'>
        <script>
            var img_tracker = true;

            async function cat_info()
            {
                const response = await fetch('https://brianobruno.github.io/cats.json', {method: 'GET'});
                const result = await response.text();
                catget = JSON.parse(result);

                const catcont = document.getElementById("showinfo");     
                catget.facts.sort((x, y) => x.factId - y.factId);       
                for (const i of catget.facts)
                {
                    const p = document.createElement("p")
                    p.textContent = i.factId + ": " + i.text;
                    catcont.appendChild(p);
                    console.log(i.factId);
                }
            }

            function swap_img()
            {
                if (img_tracker)
                {
                    catimg.src = catget.catPhoto;
                    img_tracker = !img_tracker;
                } else
                {
                    catimg.src = "./assets/minecraftcat.png";
                    img_tracker = !img_tracker;
                }
            }
        </script>
        <title>Lab 6</title>
    </head>

    <body onload="cat_info()">
        <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js" integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI" crossorigin="anonymous"></script>
        
        <div id="nav-container"></div>
        
        <div class="jumbotron">
            <div class="container-fluid">
                <div class="row">
                    <div class="col-md-1"></div>
                    <div class="col-md-11">
                        <h1 class="display-3">Cat Information</h1>
                        <p class="lead">Learn some cat facts !</p>
                    </div>
                </div>
            </div>
        </div>
        &nbsp;

        <div class="container-fluid">
            <div class="row">
                <div class="col-md-6">
                    <div class="d-grid gap-2">
                        <button class="btn btn-light" type="button" data-bs-toggle="collapse" data-bs-target="#displaycatfacts" aria-expanded="false" aria-controls="displaycatfacts">Display Cat Facts</button>
                    </div>
                    <div class="collapse multi-collapse" id="displaycatfacts">
                        <div class="card card-body">
                            <p id="showinfo"></p>
                        </div>
                    </div>
                </div>
                <div class="col-md-6">
                    <div class="d-grid gap-2">
                        <button class="btn btn-light" type="button" onclick="swap_img();">Swap Cat Image</button>
                    </div>
                    <div class="card card-body">
                        <img id="catimg" style="height: auto; max-width: 100%;" src="./assets/minecraftcat.png"/>
                    </div>
                </div>
            </div>
        </div>

        <script src="navbar.js"></script>
    </body>
</html>
